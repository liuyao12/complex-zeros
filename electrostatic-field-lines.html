    <header class="site-header article-header">

      <h1>Planar electrostatic field lines, algebraic pencils, and Newton graphs</h1>
      <p class="article-source"><em>The article body is maintained as <a href="https://github.com/liuyao12/complex-zeros/blob/main/docs/electrostatic-field-lines.md">Markdown on GitHub</a>. The floating diagram is a live companion to the text.</em></p>
    </header>

    <article class="article-shell">
      <section class="article-content">
        <aside class="floating-demo" aria-label="Floating planar electrostatic field-line demonstration">
          <figure class="interactive-card" id="ef-card">
            <div class="interactive-toolbar">
              <div class="toolbar-row configuration-row">
                <span class="configuration-label">examples</span>
                <div class="configuration-tabs" role="tablist" aria-label="Charge configurations">
                  <button type="button" class="configuration-tab is-active" data-ef-preset-tab="dipole" role="tab" aria-selected="true">opposite charges</button>
                  <button type="button" class="configuration-tab" data-ef-preset-tab="like" role="tab" aria-selected="false" tabindex="-1">like charges</button>
                  <button type="button" class="configuration-tab" data-ef-preset-tab="cubic" role="tab" aria-selected="false" tabindex="-1">three positive</button>
                  <button type="button" class="configuration-tab" data-ef-preset-tab="mixed" role="tab" aria-selected="false" tabindex="-1">mixed signs</button>
                </div>
                <select id="ef-preset" hidden aria-hidden="true">
                  <option value="dipole">opposite charges</option>
                  <option value="like">like charges</option>
                  <option value="cubic">three positive charges</option>
                  <option value="mixed">mixed signs</option>
                </select>
                <span class="demo-drag-handle" id="ef-window-drag" role="button" tabindex="0" aria-label="Drag demonstration window"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v18M12 3 8.5 6.5M12 3l3.5 3.5M12 21l-3.5-3.5M12 21l3.5-3.5M3 12h18M3 12l3.5-3.5M3 12l3.5 3.5M21 12l-3.5-3.5M21 12l3.5 3.5"/></svg></span>
              </div>
              <div class="toolbar-row action-row">
                <button type="button" id="ef-singular">Jump to a singular member</button>
                <button type="button" id="ef-fit">Fit</button>
              </div>
              <div class="toolbar-row angle-row">
                <label class="angle-control">pencil angle
                  <input id="ef-angle" type="range" min="0" max="180" step="0.25" value="45">
                  <output id="ef-angle-value">45°</output>
                </label>
              </div>
              <div class="toolbar-row toggle-row">
                <label><input id="ef-pencil-toggle" type="checkbox" checked> pencil</label>
                <label><input id="ef-potential-toggle" type="checkbox"> equipotentials</label>
                <label><input id="ef-graph-toggle" type="checkbox" checked> Newton graph</label>
                <label><input id="ef-flow-toggle" type="checkbox" checked> flow</label>
              </div>
            </div>
            <div class="demo-stage" id="ef-stage">
              <canvas id="ef-static" width="960" height="680"></canvas>
              <canvas id="ef-particles" width="960" height="680"></canvas>
              <svg id="ef-overlay" viewBox="0 0 960 680" preserveAspectRatio="none" aria-label="Interactive planar field-line diagram"></svg>
            </div>
            <figcaption><span id="ef-status" aria-live="polite"></span></figcaption>
            <span class="demo-resize-handle" id="ef-window-resize" role="button" tabindex="0" aria-label="Resize demonstration window from lower left"></span>
          </figure>
        </aside>
      </section>
    </article>
