name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move the visualization into this repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f index.html ]]; then
            base="https://raw.githubusercontent.com/liuyao12/liuyao.github.io/master/sendov-flow"
            curl -fsSL "$base/index.html" -o index.html
            curl -fsSL "$base/sendov-flow.css" -o sendov-flow.css
            curl -fsSL "$base/sendov-flow-1.js" -o sendov-flow-1.js
            curl -fsSL "$base/sendov-flow-2.js" -o sendov-flow-2.js
            curl -fsSL "$base/sendov-flow-3.js" -o sendov-flow-3.js
            curl -fsSL "$base/sendov-flow-4.js" -o sendov-flow-4.js
            touch .nojekyll
            cat > README.md <<'EOF'
          # Complex zeros

          An interactive visualization of the zeros of a complex polynomial, the zeros of its derivative, Newton separatrices, critical level contours of `log |P|`, and a path-length strengthening of Sendov's theorem.

          **Live page:** https://liuyao12.github.io/complex-zeros/

          Drag blue roots or orange critical points. Nearby points of the same kind snap together; click a snapped stack to separate it. The bars show the shortest traced descending saddle-to-root path for each root, divided by the radius of the smallest enclosing disk.
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sendov-flow.css sendov-flow-*.js README.md .nojekyll
            git commit -m "Move Sendov visualization into complex-zeros"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
